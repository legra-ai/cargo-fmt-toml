[package]
name = "cargo-fmt-toml"
description = "Cargo subcommand to format and normalize Cargo.toml layout (section order, sorted dep keys, TOML shape)"
version = "1.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "toml", "format", "cli", "workspace"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/cargo-fmt-toml"
documentation = "https://docs.rs/cargo-fmt-toml"
homepage = "https://github.com/legra-ai/cargo-fmt-toml"
rust-version = "1.94.1"
publish = true

include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "cargo-fmt-toml"
path = "src/main.rs"

[dependencies]
async-fs-io = "0.2.2"
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
taplo = "0.14.0"
toml = "1.1.4"
toml_edit = "0.25.13"
cargo-plugin-utils = "0.0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
rhusky = "2.0.1"

[dev-dependencies]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
